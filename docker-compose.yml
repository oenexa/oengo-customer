# ==============================================================================
# OenGo Customer Mobile & Web Order Backend — Standalone Stack
# ==============================================================================

version: "3.8"

services:
  oengo-customer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oengo-customer-standalone
    ports:
      - "3013:3013"
    environment:
      PORT: "3013"
      NODE_ENV: production
      OENGO_API_URL: ${OENGO_API_URL:-http://localhost:3001}
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3013/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
